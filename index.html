<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeKaergsty</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <link rel="icon" type="image/x-icon" href="/favicon.png">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="login-card">
        <h1>AnimeKaergsty</h1>
        
        <!-- ========================================== -->
        <!-- PASO 1: PEDIR API ID Y HASH -->
        <!-- ========================================== -->
        <div id="api-credentials-step">
            <p style="color: var(--secondary-text-color); margin-bottom: 15px;">Configura tu conexión con Telegram</p>
            
            <!-- Estilos integrados básicos para que cuadre con tu diseño -->
            <label style="color: #ccc; font-size: 13px; display: block; margin-bottom: 5px; text-align: left;">API ID:</label>
            <input type="number" id="user-api-id" placeholder="Ej: 1234567" style="margin-bottom: 15px;" />
            
            <label style="color: #ccc; font-size: 13px; display: block; margin-bottom: 5px; text-align: left;">API HASH:</label>
            <input type="text" id="user-api-hash" placeholder="Ej: 274305508ef10ef30b8d6d980c..." style="margin-bottom: 20px;" />
            
            <!-- Usamos tu clase 'action-btn' para que tenga el mismo estilo de tus otros botones -->
            <button id="btn-save-api" class="action-btn">Guardar y continuar</button>
        </div>

        <!-- ========================================== -->
        <!-- PASO 2: MÉTODOS DE LOGIN (Ocultos al inicio) -->
        <!-- ========================================== -->
        <div id="login-methods-container" class="hidden">
            <p style="color: var(--secondary-text-color); margin-bottom: 15px;">Elige cómo iniciar sesión</p>
            
            

            <!-- FLUJO DE TELÉFONO -->
            <div id="flow-phone">
                <div id="step-phone">
                    <input type="text" id="phone-input" placeholder="Número (Ej: +34600000000)" />
                    <button id="btn-send-code" class="action-btn">Enviar Código</button>
                </div>

                <div id="step-code" class="hidden">
                    <input type="text" id="code-input" placeholder="Código de Telegram" />
                    <button id="btn-verify-code" class="action-btn">Verificar</button>
                </div>

                <!-- Contenedor de Error 2FA -->
                <div id="step-password" class="hidden">
                    <p style="color: #ff5555; font-size: 14px; font-weight: bold;">⚠️ El inicio de sesión 2FA no está disponible en la web.</p>
                    <p style="color: var(--secondary-text-color); font-size: 13px;">Usa el inicio de sesión por <b>Código QR</b>.</p>
                </div>
            </div>

            
        </div>
    </div>

    <!-- SECCIÓN DEL REPRODUCTOR -->
    <div id="video-container" class="hidden">
        <div class="header">
            <h2 id="video-title">Cargando videos...</h2>
        </div>
        
        <div class="player-section">

            <!-- Flecha Anterior -->
            <button class="nav-btn" id="btn-prev" disabled>&#10094;</button>
            
            <div class="video-wrapper" id="video-wrapper">
                <video id="reproductor"></video>
                
                <div class="custom-controls" id="custom-controls">
                    <div class="progress-wrapper" id="progress-wrapper">
                        <input type="range" class="progress-slider" id="progress-slider" min="0" max="100" step="0.1" value="0">
                        <div class="time-tooltip" id="time-tooltip">00:00</div>
                    </div>

                    <div class="controls-main">
                        <button class="control-btn" id="btn-play">
                            <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        
                        <div class="volume-container">
                            <button class="control-btn" id="btn-mute">
                                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.1" value="1">
                        </div>

                        <div class="time-display">
                            <span id="time-current">0:00</span> / <span id="time-duration">0:00</span>
                        </div>
                        
                        <div class="spacer"></div>

                        <!-- BOTONES DE SALTO INTELIGENTES (Ocultos por defecto) -->
                        <button class="control-btn text-btn" id="btn-skip-intro" style="display: none; font-size: 13px; padding: 0 10px; white-space: nowrap; font-weight: bold; color: #4ba3e3;">
                            Omitir Intro
                        </button>
                        <button class="control-btn text-btn" id="btn-skip-ending" style="display: none; font-size: 13px; padding: 0 10px; white-space: nowrap; font-weight: bold; color: #4ba3e3;">
                            Omitir Ending
                        </button>

                        <div class="speed-container">
                            <button class="control-btn text-btn" id="btn-speed">1x</button>
                            <div class="speed-menu" id="speed-menu">
                                <div class="speed-option" data-speed="0.5">0.5x</div>
                                <div class="speed-option" data-speed="1">1x</div>
                                <div class="speed-option" data-speed="1.25">1.25x</div>
                                <div class="speed-option" data-speed="1.5">1.5x</div>
                                <div class="speed-option" data-speed="2">2x</div>
                            </div>
                        </div>

                        <button class="control-btn" id="btn-fullscreen">
                            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Flecha Siguiente -->
            <button class="nav-btn" id="btn-next" disabled>&#10095;</button>
        </div>
        <!-- NUEVA SECCIÓN DE CAPÍTULOS -->
        <div class="episodes-container" id="episodes-container" style="display: none;">

            <!-- ÚNICO ENCABEZADO LIMPIO -->
            <div class="episodes-header" style="display: flex; align-items: center; position: relative; margin-bottom: 25px; min-height: 30px;">
                
                <!-- TEXTO PEGADO A LA IZQUIERDA (JS lo convertirá en botón luego) -->
                <h3 class="episodes-title" style="margin: 0; font-size: 18px; color: #ffffff;">Episodios recientes</h3>
                
                <!-- LOGO TOTALMENTE CENTRADO -->
                <a href="https://animekt.github.io/ATC/" target="_blank" style="position: absolute; left: 50%; transform: translateX(-50%); text-decoration: none; font-size: 24px; font-weight: 900; font-family: 'Segoe UI', Arial, sans-serif; display: inline-block; transition: transform 0.2s ease; line-height: 1; white-space: nowrap;" onmouseover="this.style.transform='translateX(-50%) scale(1.05)'" onmouseout="this.style.transform='translateX(-50%) scale(1)'">
                    <span style="color: #ffffff; text-shadow: -1.5px 0px 0px #00e5ff, 1.5px 0px 0px #ff6600;">Anime</span><span style="color: #4ba3e3; text-shadow: -1.5px 0px 0px #00e5ff, 1.5px 0px 0px #ff6600;">KT</span>
                </a>

                <!-- ID OCULTO PARA QUE EL JAVASCRIPT NO TIRE ERROR -->
                <span id="current-episode-text" style="display: none;"></span>

                <!-- ⬇️ BOTONES DE DONACIÓN Y TELEGRAM A LA DERECHA ⬇️ -->
                <div class="support-buttons">
                    
                    <a href="https://t.me/Kaergsty" target="_blank" class="support-btn telegram-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.223-.548.223l.188-2.85 5.18-4.68c.223-.198-.054-.31-.346-.11l-6.4 4.02-2.76-.86c-.6-.188-.612-.6.126-.89l10.81-4.17c.5-.188.943.11.85.545z"/>
                        </svg>
                        <span class="support-text">Grupo</span>
                    </a>

                    <a href="https://www.paypal.com/paypalme/AnimeKaergsty" target="_blank" class="support-btn paypal-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M7.076 21.337H5.07a.641.641 0 0 1-.633-.74L4.932 3.84a.64.64 0 0 1 .633-.537h7.245c3.21 0 5.143 1.34 5.62 3.992.296 1.637-.1 3.528-1.503 4.908-1.42 1.396-3.52 1.83-5.83 1.83h-1.6c-.31 0-.58.23-.62.536l-1.09 6.223a.64.64 0 0 1-.611.545h-2.106V21.337z"/>
                        </svg>
                        <span class="support-text">Donar</span>
                    </a>
                    
                    <a href="https://ko-fi.com/summary/d8dfa1de-a134-42c0-ad18-1934db877c4c" target="_blank" class="support-btn kofi-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
                            <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
                            <path d="M9.5 10c-1.3 0-2.3 1-2.3 2.3 0 1.6 2.3 3.7 2.3 3.7s2.3-2.1 2.3-3.7C11.8 11 10.8 10 9.5 10z" fill="currentColor"></path>
                        </svg>
                        <span class="support-text">Suscríbete 2$</span>
                    </a>
                </div>
                <!-- ⬆️ FIN NUEVOS BOTONES ⬆️ -->

            </div> 
            <!-- ⬆️ AQUÍ SE CIERRA CORRECTAMENTE EL ENCABEZADO ⬆️ -->

            <!-- CUADRÍCULA DE EPISODIOS -->
            <div class="episodes-grid" id="episodes-grid">
                <!-- Los botones se generarán automáticamente aquí con JavaScript -->
            </div>
        
            <!-- BOTÓN DE CERRAR SESIÓN -->
            <div style="text-align: center; margin-top: 30px; width: 100%;">
                <button id="btn-logout" style="background: transparent; border: 1px solid #ff5555; color: #ff5555; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s;">
                Cerrar Sesión
                </button>
            </div>

    </div>

    

    <script>
        // Chequeo ultrarrápido: Si hay sesión en memoria, oculta el login AL INSTANTE
        // sin esperar a que cargue la pesada librería de Telegram.
        if (localStorage.getItem("telegram_session")) {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("video-container").classList.remove("hidden");
        }
    </script>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
