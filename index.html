<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeKaergsty - Premium</title>
    <style>
        :root {
            --background-color: #181818;
            --surface-color: #212121;
            --primary-text-color: #ffffff;
            --secondary-text-color: #aaaaaa;
            --primary-color: #8774e1;
            --menu-bg: #2b2b2b;
        }

        body {
            background-color: var(--background-color);
            color: var(--primary-text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }

        /* Estilos para el Login */
        .login-card { background: var(--surface-color); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 100%; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        button.action-btn { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px;}
        button.action-btn:hover { filter: brightness(1.1); }
        .hidden { display: none !important; }

        /* Estilos del Reproductor */
        .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 1100px; }
        h1 { margin: 0; font-size: 24px; font-weight: 600; }
        h2 { margin: 10px 0 0 0; color: var(--secondary-text-color); font-size: 18px; font-weight: normal; background: var(--surface-color); padding: 15px; border-radius: 10px; }

        .player-section { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 1100px; gap: 20px; }
        .nav-btn { background: transparent; color: white; border: none; font-size: 40px; cursor: pointer; transition: 0.2s; padding: 10px; }
        .nav-btn:hover:not(:disabled) { color: var(--primary-color); transform: scale(1.2); }
        .nav-btn:disabled { opacity: 0.15; cursor: default; }

        .video-wrapper {
            flex-grow: 1; 
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
        }
        video { width: 100%; display: block; outline: none; border-radius: 12px; }

        /* === NUEVOS ESTILOS DEL REPRODUCTOR PERSONALIZADO === */
        
        /* Contenedor flotante de controles */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            padding: 10px 15px 5px 15px; /* <-- Relleno más delgado */
            display: flex;
            flex-direction: column;
            gap: 3px; /* <-- Separación vertical casi al mínimo */
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        /* Mostrar controles al pasar el mouse por encima del reproductor */
        .video-wrapper:hover .custom-controls {
            opacity: 1;
        }

        /* Barra de Progreso */
        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.1s ease;
        }
        .progress-bar:hover {
            height: 8px;
        }
        .progress-filled {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            border-radius: 3px;
        }

        /* Fila de Botones Principales */
        .controls-main {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }

        /* Botones de control genéricos */
        .control-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        .control-btn:hover {
            transform: scale(1.1);
        }
        .control-btn svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        /* Texto de tiempo (0:00 / 0:00) */
        .time-display {
            font-size: 14px;
            color: #fff;
            font-weight: 500;
            user-select: none;
        }

        /* Empujador para enviar el volumen y fullscreen a la derecha */
        .spacer {
            flex-grow: 1;
        }

        /* Control de Volumen Integrado */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .volume-slider {
            width: 0px;
            opacity: 0;
            height: 4px;
            accent-color: var(--primary-color);
            transition: width 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
        }
        /* Desplegar la barra de volumen al pasar el mouse por el contenedor */
        .volume-container:hover .volume-slider {
            width: 70px;
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="login-card">
        <h1>AnimeKaergsty</h1>
        <p style="color: var(--secondary-text-color);">Inicia sesión para continuar</p>
        
        <div id="step-phone">
            <input type="text" id="phone-input" placeholder="Número (Ej: +34600000000)" />
            <button id="btn-send-code" class="action-btn">Enviar Código</button>
        </div>

        <div id="step-code" class="hidden">
            <input type="text" id="code-input" placeholder="Código de Telegram" />
            <button id="btn-verify-code" class="action-btn">Verificar</button>
        </div>

        <div id="step-password" class="hidden">
            <input type="password" id="password-input" placeholder="Contraseña 2FA" />
            <button id="btn-verify-password" class="action-btn">Entrar</button>
        </div>
    </div>

    <!-- SECCIÓN DEL REPRODUCTOR -->
    <div id="video-container" class="hidden">
        <div class="header">
            <h2 id="video-title">Cargando videos...</h2>
        </div>
        
        <div class="player-section">
            <!-- Flecha Anterior -->
            <button class="nav-btn" id="btn-prev" disabled>&#10094;</button>
            
            <div class="video-wrapper" id="video-wrapper">
                <!-- Le quitamos la palabra "controls" para ocultar los botones por defecto -->
                <video id="reproductor"></video>
                
                <!-- Nuestros controles personalizados flotantes -->
                <div class="custom-controls" id="custom-controls">
                    
                    <!-- Barra de progreso superior -->
                    <div class="progress-bar" id="progress-container">
                        <div class="progress-filled" id="progress-bar"></div>
                    </div>

                    <div class="controls-main">
                        <!-- Botón Play/Pause -->
                        <button class="control-btn" id="btn-play">
                            <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        
                        <!-- Tiempo del video -->
                        <div class="time-display">
                            <span id="time-current">0:00</span> / <span id="time-duration">0:00</span>
                        </div>
                        
                        <div class="spacer"></div>

                        <!-- Contenedor de Volumen -->
                        <div class="volume-container">
                            <button class="control-btn" id="btn-mute">
                                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.1" value="1">
                        </div>

                        <!-- Botón Pantalla Completa -->
                        <button class="control-btn" id="btn-fullscreen">
                            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Flecha Siguiente -->
            <button class="nav-btn" id="btn-next" disabled>&#10095;</button>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
