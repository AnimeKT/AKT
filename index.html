<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeKaergsty</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <link rel="icon" type="image/x-icon" href="/favicon.png">

    <style>
        /* Estilos exactos copiados de tu diseño original */
        :root {
            --background-color: #181818;
            --surface-color: #212121;
            --primary-text-color: #ffffff;
            --secondary-text-color: #aaaaaa;
            --primary-color: #8774e1;
            --menu-bg: #2b2b2b;
        }

        body {
            background-color: var(--background-color);
            color: var(--primary-text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }

        /* Estilos para el Login (Mantenemos los de tu versión anterior para que funcione la pantalla inicial) */
        .login-card { background: var(--surface-color); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 100%; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        button.action-btn { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px;}
        button.action-btn:hover { filter: brightness(1.1); }
        .hidden { display: none !important; }

        .header { text-align: center; margin: 0 auto 20px auto; width: 100%; max-width: 1400px; }
        h1 { margin: 0; font-size: 22px; font-weight: 600; }
        h2 { margin: 10px 0 0 0; color: var(--secondary-text-color); font-size: 16px; font-weight: normal; background: var(--surface-color); padding: 15px; border-radius: 10px; }

        .player-section { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 1400px; gap: 20px; }
        .nav-btn { background: transparent; color: white; border: none; font-size: 40px; cursor: pointer; transition: 0.2s; padding: 10px; }
        .nav-btn:hover:not(:disabled) { color: var(--primary-color); transform: scale(1.2); }
        .nav-btn:disabled { opacity: 0.15; cursor: default; }

        .video-wrapper {
            flex-grow: 1; 
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
        }
        video { width: 100%; display: block; outline: none; cursor: pointer; }

        /* Controles flotantes */
        .custom-controls {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            display: flex; flex-direction: column; padding-top: 30px;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .video-wrapper:hover .custom-controls { opacity: 1; }

        /* Barra de progreso */
        .progress-bar {
            width: 100%; height: 4px; background: rgba(255, 255, 255, 0.3);
            cursor: pointer; position: relative; transition: height 0.1s;
        }
        .progress-bar:hover { height: 7px; }
        .progress-filled { width: 0%; height: 100%; background: var(--primary-color); transition: width 0.1s linear; pointer-events: none; }

        .controls-main {
            display: flex; align-items: center; padding: 10px 15px; gap: 15px;
        }

        /* Botones principales y SVGs */
        .control-btn {
            background: transparent; border: none; color: white; font-size: 20px;
            cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;
            transition: color 0.2s;
        }
        .control-btn svg {
            width: 24px; height: 24px; fill: currentColor; transition: fill 0.2s;
        }
        .control-btn:hover { color: var(--primary-color); }
        .text-btn { font-size: 16px; font-weight: 600; font-family: monospace; }

        /* Contenedor de Volumen (Slider oculto) */
        .volume-container { display: flex; align-items: center; gap: 5px; }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 0px; 
            opacity: 0; 
            transition: width 0.3s, opacity 0.3s;
            cursor: pointer; 
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, var(--primary-color) 100%, rgba(255, 255, 255, 0.3) 100%);
            
            /* 👇 Estas 3 líneas eliminan el diseño horrible 👇 */
            padding: 0 !important;
            margin: 0 !important;
            border: none !important;
        }
        .volume-container:hover .volume-slider { width: 70px; opacity: 1; }

        /* Damos estilo explícito a la "bolita" (thumb) para que coincida con tu diseño */
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-color);
        }

        .time-display { font-size: 14px; color: #e0e0e0; font-weight: 500; }
        .spacer { flex-grow: 1; }

        /* Menú de Velocidad flotante */
        .speed-container { position: relative; }
        .speed-menu {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: var(--menu-bg); border-radius: 8px; overflow: hidden;
            display: none; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .speed-menu.active { display: flex; }
        .speed-option {
            padding: 10px 20px; cursor: pointer; color: white; font-size: 14px; text-align: center; transition: 0.2s;
        }
        .speed-option:hover { background: rgba(255,255,255,0.1); color: var(--primary-color); }

        
    </style>
</head>
<body>

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="login-card">
        <h1>AnimeKaergsty</h1>
        <p style="color: var(--secondary-text-color);">Elige cómo iniciar sesión</p>
        
        <!-- Pestañas -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="tab-phone" class="action-btn" style="margin: 0; background-color: var(--primary-color);">Teléfono</button>
            <button id="tab-qr" class="action-btn" style="margin: 0; background-color: #444;">Código QR</button>
        </div>

        <!-- FLUJO DE TELÉFONO -->
        <div id="flow-phone">
            <div id="step-phone">
                <input type="text" id="phone-input" placeholder="Número (Ej: +34600000000)" />
                <button id="btn-send-code" class="action-btn">Enviar Código</button>
            </div>

            <div id="step-code" class="hidden">
                <input type="text" id="code-input" placeholder="Código de Telegram" />
                <button id="btn-verify-code" class="action-btn">Verificar</button>
            </div>

            <!-- Contenedor de Error 2FA -->
            <div id="step-password" class="hidden">
                <p style="color: #ff5555; font-size: 14px; font-weight: bold;">⚠️ El inicio de sesión 2FA no está disponible en la web.</p>
                <p style="color: var(--secondary-text-color); font-size: 13px;">Usa el inicio de sesión por <b>Código QR</b>.</p>
            </div>
        </div>

        <!-- FLUJO DE QR -->
        <div id="flow-qr" class="hidden">
            <p style="font-size: 14px; color: var(--secondary-text-color); margin-bottom: 15px;">Abre Telegram en tu móvil > Ajustes > Dispositivos > Vincular dispositivo</p>
            <!-- Aquí se pintará el código QR -->
            <div id="qr-container" style="background: white; padding: 15px; border-radius: 10px; display: inline-block; min-width: 200px; min-height: 200px;">
            </div>
        </div>
    </div>

    <!-- SECCIÓN DEL REPRODUCTOR -->
    <div id="video-container" class="hidden">
        <div class="header">
            <h2 id="video-title">Cargando videos...</h2>
        </div>
        
        <div class="player-section">
            <!-- Flecha Anterior -->
            <button class="nav-btn" id="btn-prev" disabled>&#10094;</button>
            
            <div class="video-wrapper" id="video-wrapper">
                <video id="reproductor"></video>
                
                <div class="custom-controls" id="custom-controls">
                    <div class="progress-bar" id="progress-container">
                        <div class="progress-filled" id="progress-bar"></div>
                    </div>

                    <div class="controls-main">
                        <button class="control-btn" id="btn-play">
                            <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        
                        <div class="volume-container">
                            <button class="control-btn" id="btn-mute">
                                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.1" value="1">
                        </div>

                        <div class="time-display">
                            <span id="time-current">0:00</span> / <span id="time-duration">0:00</span>
                        </div>
                        
                        <div class="spacer"></div>

                        <div class="speed-container">
                            <button class="control-btn text-btn" id="btn-speed">1x</button>
                            <div class="speed-menu" id="speed-menu">
                                <div class="speed-option" data-speed="0.5">0.5x</div>
                                <div class="speed-option" data-speed="1">1x</div>
                                <div class="speed-option" data-speed="1.25">1.25x</div>
                                <div class="speed-option" data-speed="1.5">1.5x</div>
                                <div class="speed-option" data-speed="2">2x</div>
                            </div>
                        </div>

                        <button class="control-btn" id="btn-fullscreen">
                            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Flecha Siguiente -->
            <button class="nav-btn" id="btn-next" disabled>&#10095;</button>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px; width: 100%;">
            <button id="btn-logout" style="background: transparent; border: 1px solid #ff5555; color: #ff5555; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s;">
                Cerrar Sesión
            </button>
        </div>

    <script>
        // Chequeo ultrarrápido: Si hay sesión en memoria, oculta el login AL INSTANTE
        // sin esperar a que cargue la pesada librería de Telegram.
        if (localStorage.getItem("telegram_session")) {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("video-container").classList.remove("hidden");
        }
    </script>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
